[project]
name = "gtm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastembed>=0.4", "numpy", "requests"]

[project.optional-dependencies]
browser = ["playwright", "cryptography"]
dev = ["pytest", "playwright", "cryptography"]

[project.scripts]
code_gtm = "gtm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm"]
